<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal Pro - Apply Now</title>
    <link rel="stylesheet" href="job-portal-test.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <h2>🛠️ Field Controls</h2>

            <!-- Personal Information Toggles -->
            <div class="field-toggle">
                <label for="toggle-firstName">First Name</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-firstName" checked onchange="toggleField('firstName')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-lastName">Last Name</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-lastName" checked onchange="toggleField('lastName')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-fullName">Full Name</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-fullName" onchange="toggleField('fullName')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-email">Email</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-email" checked onchange="toggleField('email')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-phone">Phone</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-phone" checked onchange="toggleField('phone')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-address">Address</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-address" checked onchange="toggleField('address')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-city">City</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-city" checked onchange="toggleField('city')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-state">State</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-state" checked onchange="toggleField('state')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-zipCode">ZIP Code</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-zipCode" checked onchange="toggleField('zipCode')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-country">Country</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-country" checked onchange="toggleField('country')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-linkedin">LinkedIn URL</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-linkedin" onchange="toggleField('linkedin')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-github">GitHub URL</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-github" onchange="toggleField('github')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-portfolio">Portfolio URL</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-portfolio" onchange="toggleField('portfolio')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-currentLocation">Current Location</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-currentLocation" onchange="toggleField('currentLocation')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-willingToRelocate">Willing to Relocate</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-willingToRelocate" onchange="toggleField('willingToRelocate')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-totalExperience">Total Experience</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-totalExperience" onchange="toggleField('totalExperience')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-noticePeriod">Notice Period</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-noticePeriod" onchange="toggleField('noticePeriod')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-currentSalary">Current Salary</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-currentSalary" onchange="toggleField('currentSalary')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-expectedSalary">Expected Salary</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-expectedSalary" onchange="toggleField('expectedSalary')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-experience">Experience</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-experience" onchange="toggleField('experience')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-salary">Salary Expectation</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-salary" onchange="toggleField('salary')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-coverLetter">Cover Letter</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-coverLetter" onchange="toggleField('coverLetter')">
                    <span class="slider"></span>
                </div>
            </div>

            <div class="field-toggle">
                <label for="toggle-availability">Availability</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-availability" onchange="toggleField('availability')">
                    <span class="slider"></span>
                </div>
            </div>

            <!-- Custom Fields Section -->
            <div class="custom-field-section">
                <h3 style="color: #2c3e50; margin-bottom: 15px; font-size: 16px;">➕ Custom Fields</h3>
                
                <button class="add-field-btn" onclick="showCustomFieldCreator()">+ Add Custom Field</button>
                
                <div id="custom-field-creator" style="display: none;">
                    <input type="text" id="custom-field-name" class="custom-field-input" placeholder="Field Name (e.g., github)">
                    <input type="text" id="custom-field-label" class="custom-field-input" placeholder="Display Label (e.g., GitHub Profile)">
                    <select id="custom-field-type" class="field-type-select">
                        <option value="text">Text Input</option>
                        <option value="email">Email Input</option>
                        <option value="url">URL Input</option>
                        <option value="tel">Phone Input</option>
                        <option value="number">Number Input</option>
                        <option value="date">Date Input</option>
                        <option value="select">Select Dropdown</option>
                        <option value="textarea">Text Area</option>
                    </select>
                    <input type="text" id="custom-field-placeholder" class="custom-field-input" placeholder="Placeholder text (optional)">
                    <button class="create-field-btn" onclick="createCustomField()">Create Field</button>
                    <button class="create-field-btn" onclick="hideCustomFieldCreator()" style="background: #95a5a6;">Cancel</button>
                </div>
                
                <div id="custom-fields-list">
                    <!-- Custom field toggles will be added here -->
                </div>
            </div>
        </div>

        <!-- Main Application Form -->
        <div class="main-content">
            <h1>JobPortal Pro</h1>
            <p class="job-title">Apply for: Senior Software Developer</p>

            <form id="jobApplicationForm" onsubmit="handleSubmit(event)">
                <!-- Personal Information Section -->
                <div class="form-section">
                    <h3>📋 Personal Information</h3>
                    
                    <div class="form-row">
                        <div class="form-group visible" id="field-firstName">
                            <label for="firstName">First Name <span class="field-indicator">(firstName)</span></label>
                            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name">
                        </div>
                        
                        <div class="form-group visible" id="field-lastName">
                            <label for="lastName">Last Name <span class="field-indicator">(lastName)</span></label>
                            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" id="field-fullName">
                            <label for="fullName">Full Name <span class="field-indicator">(fullName)</span></label>
                            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group visible" id="field-email">
                            <label for="email">Email Address <span class="field-indicator">(email)</span></label>
                            <input type="email" id="email" name="email" placeholder="your.email@example.com">
                        </div>
                        
                        <div class="form-group visible" id="field-phone">
                            <label for="phone">Phone Number <span class="field-indicator">(phone)</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="+91 9876543210">
                        </div>
                    </div>
                </div>

                <!-- Address Information Section -->
                <div class="form-section">
                    <h3>🏠 Address Information</h3>
                    
                    <div class="form-row">
                        <div class="form-group visible" id="field-address">
                            <label for="address">Street Address <span class="field-indicator">(address)</span></label>
                            <input type="text" id="address" name="address" placeholder="123 Main Street, Apt 4B">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group visible" id="field-city">
                            <label for="city">City <span class="field-indicator">(city)</span></label>
                            <input type="text" id="city" name="city" placeholder="San Francisco">
                        </div>
                        
                        <div class="form-group visible" id="field-state">
                            <label for="state">State<span class="field-indicator">(state)</span></label>
                            <input type="text" id="state" name="state" placeholder="e.g. Punjab">
                        </div>
                        
                        <div class="form-group visible" id="field-zipCode">
                            <label for="zipCode">ZIP/Postal Code <span class="field-indicator">(zipCode)</span></label>
                            <input type="text" id="zipCode" name="zipCode" placeholder="e.g. 94105">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group visible" id="field-country">
                            <label for="country">Country <span class="field-indicator">(country)</span></label>
                            <select id="country" name="country">
                                <option value="IN">India</option>
                                <option value="US">United States</option>
                                <option value="CA">Canada</option>
                                <option value="UK">United Kingdom</option>
                                <option value="AU">Australia</option>
                                <option value="DE">Germany</option>
                                <option value="FR">France</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" id="field-currentLocation">
                            <label for="currentLocation">Current Location <span class="field-indicator">(currentLocation)</span></label>
                            <input type="text" id="currentLocation" name="currentLocation" placeholder="e.g., San Francisco, CA">
                        </div>
                        
                        <div class="form-group" id="field-willingToRelocate">
                            <label for="willingToRelocate">Willing to Relocate <span class="field-indicator">(willingToRelocate)</span></label>
                            <select id="willingToRelocate" name="willingToRelocate">
                                <option value="">Select option</option>
                                <option value="yes">Yes</option>
                                <option value="no">No</option>
                                <option value="maybe">Open to discussion</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Professional Information Section -->
                <div class="form-section">
                    <h3>💼 Professional Information</h3>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-linkedin">
                            <label for="linkedin">LinkedIn Profile <span class="field-indicator">(linkedin)</span></label>
                            <input type="url" id="linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/yourprofile">
                        </div>
                        
                        <div class="form-group" id="field-github">
                            <label for="github">GitHub Profile <span class="field-indicator">(github)</span></label>
                            <input type="url" id="github" name="github" placeholder="https://github.com/yourusername">
                        </div>
                        
                        <div class="form-group" id="field-portfolio">
                            <label for="portfolio">Portfolio/Website <span class="field-indicator">(portfolio)</span></label>
                            <input type="url" id="portfolio" name="portfolio" placeholder="https://yourportfolio.com">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-totalExperience">
                            <label for="totalExperience">Total Experience <span class="field-indicator">(totalExperience)</span></label>
                            <input type="text" id="totalExperience" name="totalExperience" placeholder="e.g., 5 years 6 months">
                        </div>
                        
                        <div class="form-group" id="field-noticePeriod">
                            <label for="noticePeriod">Notice Period <span class="field-indicator">(noticePeriod)</span></label>
                            <select id="noticePeriod" name="noticePeriod">
                                <option value="">Select notice period</option>
                                <option value="immediate">Immediate</option>
                                <option value="15 days">15 days</option>
                                <option value="30 days">30 days</option>
                                <option value="45 days">45 days</option>
                                <option value="60 days">60 days</option>
                                <option value="90 days">90 days</option>
                                <option value="negotiable">Negotiable</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-currentSalary">
                            <label for="currentSalary">Current Salary/CTC <span class="field-indicator">(currentSalary)</span></label>
                            <input type="text" id="currentSalary" name="currentSalary" placeholder="e.g., $85,000 or ₹15,00,000">
                        </div>
                        
                        <div class="form-group" id="field-expectedSalary">
                            <label for="expectedSalary">Expected Salary/CTC <span class="field-indicator">(expectedSalary)</span></label>
                            <input type="text" id="expectedSalary" name="expectedSalary" placeholder="e.g., $100,000 or ₹18,00,000">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-experience">
                            <label for="experience">Years of Experience <span class="field-indicator">(experience)</span></label>
                            <select id="experience" name="experience">
                                <option value="">Select Experience</option>
                                <option value="0-1">0-1 years</option>
                                <option value="1-3">1-3 years</option>
                                <option value="3-5">3-5 years</option>
                                <option value="5-10">5-10 years</option>
                                <option value="10+">10+ years</option>
                            </select>
                        </div>
                    </div>

                    <!-- Job Experience Sub-section -->
                    <div class="job-experience-section" style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e9ecef;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 style="color: #2c3e50; margin: 0; font-size: 16px;">🏢 Job Experience</h4>
                            <button type="button" class="add-experience-btn" onclick="addExperienceCard()" style="
                                background: #3498db;
                                color: white;
                                border: none;
                                border-radius: 6px;
                                padding: 8px 16px;
                                cursor: pointer;
                                font-size: 12px;
                                font-weight: 500;
                                transition: background 0.3s;
                            ">+ Add Experience</button>
                        </div>
                        
                        <div id="experience-cards-container">
                            <!-- Experience cards will be added here -->
                        </div>
                    </div>
                </div>

                <!-- Additional Information Section -->
                <div class="form-section">
                    <h3>📝 Additional Information</h3>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-coverLetter">
                            <label for="coverLetter">Cover Letter <span class="field-indicator">(coverLetter)</span></label>
                            <textarea id="coverLetter" name="coverLetter" placeholder="Tell us why you're interested in this position..."></textarea>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group" id="field-availability">
                            <label for="availability">Availability <span class="field-indicator">(availability)</span></label>
                            <select id="availability" name="availability">
                                <option value="">Select Availability</option>
                                <option value="immediate">Immediate</option>
                                <option value="2-weeks">2 weeks notice</option>
                                <option value="1-month">1 month notice</option>
                                <option value="negotiable">Negotiable</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms">
                        <label for="terms">I agree to the terms and conditions</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter" checked>
                        <label for="newsletter">Subscribe to job alerts</label>
                    </div>
                </div>

                <!-- Custom Fields Section -->
                <div class="form-section" id="custom-fields-section">
                    <h3>🔧 Custom Fields</h3>
                    <div id="custom-form-fields">
                        <!-- Custom fields will be added here -->
                    </div>
                </div>

                <button type="submit" class="submit-btn">🚀 Submit Application</button>
            </form>
        </div>
    </div>

    <script src="job-portal-test.js"></script>
</body>
</html>
